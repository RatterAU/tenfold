<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>TENFOLD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0c0f'/><text x='16' y='23' font-family='monospace' font-size='19' fill='%23fff' text-anchor='middle'>10</text></svg>">
<style>
  :root{
    --bg:#fff; --ink:#0b0c0f; --dim:#565b66; --dim2:#8b909b;
    --line:#dcdee3; --hair:#edeef1;
    --gutter:#0b0c0f; --gutter-ink:#fff;
    --callbg:#effaf3; --putbg:#fdf1f1;
    --up:#0a7d43; --dn:#c62c2c; --spot:#0b5fd0;
    --rowh:46px; --bandh:34px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  }
  /* graphite, not black — warm enough to read for hours */
  :root[data-theme=dark]{
    --bg:#181b21; --ink:#eef1f5; --dim:#a3aab6; --dim2:#767e8b;
    --line:#2e333c; --hair:#252a32;
    --gutter:#2b313b; --gutter-ink:#f4f6f9;
    --callbg:#1a2a24; --putbg:#2a1e20;
    --up:#4ade80; --dn:#f47272; --spot:#5c9bff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink);
    font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    font-feature-settings:"tnum" 1; letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased; padding:0 16px calc(40px + env(safe-area-inset-bottom));
  }
  main{max-width:680px;margin:0 auto}

  header{display:flex;align-items:center;gap:24px;padding:20px 2px 14px}
  .mark{font:700 12px/1 var(--mono);letter-spacing:.24em}
  .theme{margin-right:auto;background:none;border:1px solid var(--line);border-radius:999px;
         width:28px;height:28px;cursor:pointer;color:var(--dim);font-size:13px;line-height:1;
         display:grid;place-items:center;padding:0}
  .theme:hover{border-color:var(--dim2);color:var(--ink)}
  .q{position:relative}
  .q .lbl{font:700 10px/1 var(--mono);letter-spacing:.16em;color:var(--dim2)}
  .q .age{font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--dim2);margin-top:5px}
  .q .age.stale{color:#b8860b}
  .q .val{font:600 22px/1.25 var(--mono);letter-spacing:-.03em;margin-top:4px;transition:color .5s}
  .q .val.up{color:var(--up);transition:none} .q .val.dn{color:var(--dn);transition:none}
  .q .chg{font:500 11.5px/1 var(--mono)}
  .chg.u{color:var(--up)} .chg.d{color:var(--dn)}

  .strip{display:flex;align-items:center;gap:14px;padding:0 2px 10px;
         font:600 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
  .strip .r{margin-left:auto;display:flex;align-items:center;gap:6px}
  .strip label{display:flex;align-items:center;gap:5px;color:var(--dim2)}
  .strip select{font:inherit;color:var(--dim);background:var(--bg);border:1px solid var(--line);
        border-radius:6px;padding:3px 5px;cursor:pointer}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:b 2.4s infinite}
  .dot.w{background:#b8860b;animation:none} .dot.e{background:var(--dn);animation:none}
  @keyframes b{0%,100%{opacity:1}50%{opacity:.25}}

  .chain{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  .hd,.row{display:grid;grid-template-columns:1fr 132px 1fr;align-items:center}

  .hd{font:700 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim2);border-bottom:1px solid var(--line)}
  .hd span{padding:12px 18px}
  .hd .c{background:var(--gutter);color:var(--gutter-ink);text-align:center;padding:12px 0}
  .hd .r{text-align:right}

  .row{height:var(--rowh);cursor:pointer;font:500 17px/1 var(--mono);letter-spacing:-.03em;
       border-bottom:1px solid var(--hair);position:relative}
  .row.call{background:var(--callbg)} .row.put{background:var(--putbg)}
  .row > span{padding:0 18px}
  .row .c{background:var(--gutter);color:var(--gutter-ink);text-align:center;height:100%;
          display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17.5px}
  .row .r{text-align:right;color:var(--dim)}
  .row:hover{filter:brightness(.975)}
  .row.open{box-shadow:inset 0 0 0 2px var(--spot);z-index:2}
  /* two SPX strikes can round to the same SPY strike — dim the looser of the pair */
  .row.far span:first-child,.row.far .r{opacity:.42}
  .row.best span:first-child{font-weight:700}
  .row.best span:first-child::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
        background:var(--spot);margin-left:7px;vertical-align:middle}

  /* spot band — reserves its own height so nothing is ever covered */
  .spot{height:var(--bandh);position:relative;z-index:3;background:var(--bg);
        border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .spot .slide{position:absolute;inset:0;transform:translateY(var(--o,0px));
        transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .spot .bar{position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:var(--spot)}
  .spot .p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        font:700 13px/1 var(--mono);letter-spacing:-.03em;color:#fff;background:var(--spot);
        padding:5px 12px;border-radius:999px;white-space:nowrap;
        box-shadow:0 0 0 3px var(--bg)}
  .spot .p em{font-style:normal;opacity:.62;font-size:11.5px;margin-left:6px}

  .panel{padding:16px 18px 18px;background:color-mix(in srgb,var(--spot) 7%,var(--bg));border-bottom:1px solid var(--hair);
         box-shadow:inset 0 0 0 2px var(--spot);animation:d .16s ease-out}
  @keyframes d{from{opacity:0}}
  .panel .in{display:flex;align-items:center;gap:11px;margin-bottom:15px}
  .panel label{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--dim)}
  .panel input{width:112px;font:500 18px/1 var(--mono);color:var(--ink);background:var(--bg);
    border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;letter-spacing:-.03em}
  .panel input:focus{border-color:var(--spot);box-shadow:0 0 0 3px rgba(11,95,208,.15)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:15px}
  .grid .k{font:700 9.5px/1 var(--mono);letter-spacing:.12em;color:var(--dim2);display:block;margin-bottom:7px}
  .grid .v{font:600 20px/1 var(--mono);letter-spacing:-.03em}
  .grid .v.s{color:var(--dim);font-weight:500;font-size:17px}
  .fine{margin-top:13px;font:400 11.5px/1.55 -apple-system,system-ui,sans-serif;color:var(--dim)}
  .foot{padding:13px 2px 0;font:400 11px/1.6 -apple-system,system-ui,sans-serif;color:var(--dim2)}
  @media(max-width:430px){
    body{padding:0 11px 40px} header{gap:14px} .q .val{font-size:19px}
    .hd,.row{grid-template-columns:1fr 104px 1fr}
    .row{font-size:15.5px} .row > span,.hd span{padding:0 11px}
    .hd span{padding:12px 11px} .spot .p{font-size:12px;padding:5px 10px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="mark">TENFOLD</span>
    <button class="theme" id="theme" title="Toggle theme" aria-label="Toggle light or dark theme">◐</button>
    <div class="q"><div class="lbl">SPX</div><div class="val" id="spxV">—</div><div class="chg" id="spxC">—</div><div class="age" id="spxA"></div></div>
    <div class="q"><div class="lbl">SPY</div><div class="val" id="spyV">—</div><div class="chg" id="spyC">—</div><div class="age" id="spyA"></div></div>
  </header>

  <div class="strip">
    <span id="ratio">—</span>
    <label>±<select id="n"><option>5<option>8<option>12<option>20<option>30<option>50</select> STRIKES</label>
    <span class="r"><span class="dot" id="dot"></span><span id="stat">…</span></span>
  </div>

  <div class="chain">
    <div class="hd"><span>SPY STRIKE</span><span class="c">SPX STRIKE</span><span class="r">SPY EXACT EQUIV</span></div>
    <div id="ladder"></div>
  </div>

  <p class="foot">Green above spot, red below. No prices — no free feed quotes options faster than once a second.
     Tap a strike to price it. Quotes via Yahoo, 3s poll; verify on your broker.</p>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const YQ = s => `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(s)}?interval=1m&range=1d`;
// Yahoo sends no CORS headers — relay chain with failover.
const RELAYS = [
  u => `https://api.cors.lol/?url=${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${u}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => u,
];
let relay = 0;

const WIDTH = 5, ROWH = 46, BANDH = 34;  // SPX grid spacing, row height, spot band height (px)
const ET = {timeZone:'America/New_York', hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'};
const S = {spx:null, spy:null, open:null, prem:{}};

async function quote(sym){
  for(let i=0;i<RELAYS.length;i++){
    const r = RELAYS[(relay+i)%RELAYS.length];
    try{
      const m = (await (await fetch(r(YQ(sym)),{cache:'no-store'})).json()).chart.result[0].meta;
      if(typeof m.regularMarketPrice !== 'number') throw 0;
      relay = (relay+i)%RELAYS.length;
      return {px:m.regularMarketPrice, prev:m.chartPreviousClose ?? m.previousClose, st:m.marketState,
              t:(m.regularMarketTime ?? 0) * 1000};
    }catch(e){}
  }
  throw 0;
}

const f = (n,d=2) => n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const ratio = () => S.spx.px / S.spy.px;
// SPY trails SPX by accrued dividends, so the ratio sits near 10.03, not 10.
const equiv = k => k / ratio();

function paint(k, q, prev){
  const v = $(k+'V'), c = $(k+'C');
  v.textContent = f(q.px);
  if(prev != null && q.px !== prev){
    v.classList.remove('up','dn'); void v.offsetWidth;
    v.classList.add(q.px > prev ? 'up' : 'dn');
  }
  const d = q.px - q.prev, u = d >= 0;
  c.className = 'chg ' + (u ? 'u' : 'd');
  c.textContent = `${u?'+':''}${f(d)}  ${u?'+':''}${f(d/q.prev*100)}%`;
}

// how old the exchange says the print is — not how long ago we polled
function ages(){
  for(const k of ['spx','spy']){
    const q = S[k], el = $(k+'A');
    if(!q || !q.t){ el.textContent = ''; continue; }
    const s = Math.max(0, Math.round((Date.now() - q.t)/1000));
    el.textContent = s < 60 ? s + 's ago'
                   : s < 3600 ? Math.floor(s/60) + 'm ago'
                   : Math.floor(s/3600) + 'h ago';
    el.classList.toggle('stale', s > 30);
  }
}

async function tick(){
  try{
    const a = S.spx?.px, b = S.spy?.px;
    const [spx, spy] = await Promise.all([quote('^GSPC'), quote('SPY')]);
    S.spx = spx; S.spy = spy;
    paint('spx', spx, a); paint('spy', spy, b);
    $('ratio').textContent = 'RATIO ' + f(ratio(), 4);
    ages();
    const live = spy.st === 'REGULAR';
    $('dot').className = 'dot' + (live ? '' : ' w');
    $('stat').textContent = (live ? 'LIVE' : spy.st || 'CLOSED') + ' ' + new Date().toLocaleTimeString('en-US', ET) + ' ET';
    render();
  }catch(e){
    $('dot').className = 'dot e'; $('stat').textContent = 'RECONNECTING';
  }
}

// user picks the depth; ladder scrolls and keeps spot centred on load and on resize
const fitN = () => +$('n').value;

let lastHTML = '', centred = false;
function render(){
  const el = document.activeElement, caret = el && el.id === 'prem' ? el.selectionStart : null;
  const h = build(fitN());
  if(h !== lastHTML){ lastHTML = h; $('ladder').innerHTML = h; }   // most ticks change nothing but the band
  if(caret !== null){ const i = $('prem'); i.focus(); i.setSelectionRange(caret, caret); }
  placeLine(S.spx.px);
  if(!centred){ centred = true; centre(); }
}
const centre = () => requestAnimationFrame(() =>
  document.querySelector('.spot')?.scrollIntoView({block:'center'}));

function build(N){
  const spot = S.spx.px, base = Math.round(spot / WIDTH) * WIDTH;
  const lo = base - N*WIDTH, hi = base + N*WIDTH;
  // the SPX strike whose equivalent lands closest to each listed SPY strike is the real pair
  const best = new Map();
  for(let k = lo; k <= hi; k += WIDTH){
    const listed = Math.round(equiv(k)), d = Math.abs(equiv(k) - listed);
    if(!best.has(listed) || d < best.get(listed).d) best.set(listed, {k, d});
  }
  const out = [];
  // ascending down the page, matching a broker chain
  for(let k = lo; k <= hi; k += WIDTH){
    if(k > spot && !out.includes(LINE)) out.push(LINE);   // band goes in above the first strike over spot
    out.push(row(k, best.get(Math.round(equiv(k))).k === k));
  }
  return out.join('');
}

const LINE = `<div class="spot"><div class="slide" id="spotline"><div class="bar"></div>
  <span class="p"><span id="spotSpx"></span><em id="spotSpy"></em></span></div></div>`;

// The band sits between the two bracketing strikes; drift the line inside it to show
// where spot actually falls in that 5-point gap, without ever covering a row.
function placeLine(spot){
  const el = $('spotline'); if(!el) return;
  const frac = (spot - Math.floor(spot / WIDTH) * WIDTH) / WIDTH;   // 0 at lower strike, 1 at upper
  el.style.setProperty('--o', ((frac - 0.5) * (BANDH - 12)).toFixed(1) + 'px');
  $('spotSpx').textContent = f(spot, 2);
  $('spotSpy').textContent = f(S.spy.px, 2);
}

function row(k, best){
  const e = equiv(k), open = S.open === k, side = k > S.spx.px ? 'call' : 'put';
  const r = `<div class="row ${side} ${best ? 'best' : 'far'}${open?' open':''}" data-k="${k}" role="button" tabindex="0">
    <span>${Math.round(e)}</span><span class="c">${k.toLocaleString()}</span><span class="r">${f(e)}</span>
  </div>`;
  return open ? r + panel(k) : r;
}

// Exact part: an SPX option's payoff divided by the ratio IS an SPY option at strike k/ratio.
// Inexact part: the listed SPY strike is up to 2.5 SPX points (~0.25 SPY) away, and no model-free
// value exists for that shift. But |dPremium/dStrike| <= 1 always, so the listed premium is pinned
// inside a band of width |gap| — a bound, not a guess. Calls fall as strike rises, puts rise.
function bounds(spyPrem, gap, isCall){
  const other = spyPrem - (isCall ? gap : -gap);
  return [Math.min(spyPrem, other), Math.max(spyPrem, other)];
}

// --- the gap estimate, tightened -------------------------------------------
// The bound above is worst-case. The true slope is dC/dK = -N(d2) (calls) or
// +N(-d2) (puts) — and the premium you typed already implies the vol that
// fixes it, so no options feed is needed. Solve sigma, read the slope, walk
// the gap. r = q = 0: over a few hours of 0DTE that is under a tenth of a cent.
const ncdf = x => {                                   // A&S 7.1.26, |err| < 1.5e-7
  const t = 1/(1 + .2316419*Math.abs(x));
  const p = t*(.319381530 + t*(-.356563782 + t*(1.781477937 + t*(-1.821255978 + t*1.330274429))));
  const v = 1 - Math.exp(-x*x/2)/Math.sqrt(2*Math.PI)*p;
  return x >= 0 ? v : 1 - v;
};
const bs = (S, K, T, s, isCall) => {
  const v = s*Math.sqrt(T), d1 = (Math.log(S/K) + v*v/2)/v, d2 = d1 - v;
  return isCall ? S*ncdf(d1) - K*ncdf(d2) : K*ncdf(-d2) - S*ncdf(-d1);
};

// seconds until today's 4:00pm ET settlement, or null once the day is done
function toClose(){
  const [h,m,sec] = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour12:false,
    hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date()).split(':').map(Number);
  const left = 16*3600 - (h*3600 + m*60 + sec);
  return left > 60 ? left : null;                     // inside the last minute the solve is noise
}

// bisection, not Newton: vega collapses near expiry and Newton walks off a cliff there
function slope(S, K, prem, isCall, secs){
  if(!secs) return null;
  const T = secs/(365*24*3600), intrinsic = Math.max(0, isCall ? S-K : K-S);
  if(prem <= intrinsic || prem >= (isCall ? S : K)) return null;   // no sigma solves this
  let lo = 1e-4, hi = 5;
  if(bs(S,K,T,hi,isCall) < prem) return null;                      // past what 500% vol can price
  for(let i = 0; i < 60; i++){
    const mid = (lo+hi)/2;
    if(bs(S,K,T,mid,isCall) < prem) lo = mid; else hi = mid;
  }
  const s = (lo+hi)/2, v = s*Math.sqrt(T), d2 = (Math.log(S/K) + v*v/2)/v - v;
  return {iv: s, d: isCall ? -ncdf(d2) : ncdf(-d2)};               // unitless: same in SPY space
}

// everything the panel shows for a typed premium, in one place so the live
// input handler and the rendered panel can never disagree
function price(k, n){
  const e = equiv(k), listed = Math.round(e), gap = listed - e, isCall = k > S.spx.px;
  const o = {e, listed, gap, isCall};
  if(!(Number.isFinite(n) && n > 0)) return o;
  o.spy = n / ratio();
  o.b = bounds(o.spy, gap, isCall);
  const sl = slope(S.spx.px, k, n, isCall, toClose());
  if(sl){
    o.iv = sl.iv;
    // clamp: the model estimate can never leave the model-free band
    o.est = Math.min(o.b[1], Math.max(o.b[0], Math.max(0, o.spy + sl.d*gap)));
  }
  return o;
}
const fmtL = o => o.spy == null ? '—'
  : o.est != null ? '$' + f(o.est)
  : '$' + f(o.b[0]) + '–$' + f(o.b[1]);

function panel(k){
  const raw = S.prem[k] ?? '', o = price(k, parseFloat(raw));
  return `<div class="panel">
    <div class="in">
      <label>SPX ${k.toLocaleString()} @ $</label>
      <input id="prem" inputmode="decimal" placeholder="0.00" value="${raw}" autocomplete="off">
    </div>
    <div class="grid">
      <div><span class="k">SPY @ ${f(o.e)}</span><span class="v" id="out">${o.spy != null ? '$'+f(o.spy) : '—'}</span></div>
      <div><span class="k">SPY @ ${o.listed}</span><span class="v" id="outL">${fmtL(o)}</span></div>
      <div><span class="k">STRIKE GAP</span><span class="v s">${o.gap>=0?'+':''}${f(o.gap)}</span></div>
      <div><span class="k">0DTE IV</span><span class="v s" id="outIV">${o.iv != null ? f(o.iv*100,1)+'%' : '—'}</span></div>
    </div>
    <p class="fine" id="outNote">${note(o)}</p>
  </div>`;
}

function note(o){
  const head = `Not a flat &divide;10. SPY trails SPX by accrued dividends (live ratio ${f(ratio(),4)}), and
    SPX's 5-point grid puts this strike ${f(Math.abs(o.gap))} off the nearest listed SPY strike.`;
  if(o.spy == null) return head;
  const tail = o.est != null
    ? `$${f(o.spy)} is exact for the equivalent ${f(o.e)} strike. For the listed ${o.listed}
       ${o.isCall?'call':'put'}, your premium implies ${f(o.iv*100,1)}% vol, so the strike slope is
       ${f(Math.abs(o.est-o.spy)/Math.abs(o.gap||1),2)} — that walks the gap to $${f(o.est)}
       (bound: $${f(o.b[0])}–$${f(o.b[1])}).`
    : `$${f(o.spy)} is exact for the equivalent ${f(o.e)} strike. No vol solves that premium at this
       hour, so the listed ${o.listed} only gets its model-free band, $${f(o.b[0])}–$${f(o.b[1])}.`;
  return `${head} ${tail} Verify on your broker.`;
}

$('ladder').addEventListener('click', e => {
  const r = e.target.closest('.row'); if(!r) return;
  const k = +r.dataset.k;
  S.open = S.open === k ? null : k;
  render();
  if(S.open === k) $('prem').focus();
});
$('ladder').addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')){ e.preventDefault(); e.target.click(); }
});
$('ladder').addEventListener('input', e => {
  if(e.target.id !== 'prem') return;
  S.prem[S.open] = e.target.value;
  const o = price(S.open, parseFloat(e.target.value));
  $('out').textContent = o.spy != null ? '$' + f(o.spy) : '—';
  $('outL').textContent = fmtL(o);
  $('outIV').textContent = o.iv != null ? f(o.iv*100,1) + '%' : '—';
  $('outNote').innerHTML = note(o);
});

const theme = t => {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#181b21' : '#ffffff';
  $('theme').textContent = t === 'dark' ? '☀' : '◐';
  localStorage.tenfoldTheme = t;
};
$('n').value = localStorage.tenfoldN || '12';
$('n').onchange = () => { localStorage.tenfoldN = $('n').value; centred = false; if(S.spx) render(); };

theme(localStorage.tenfoldTheme || 'light');
$('theme').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

tick();
setInterval(tick, 3000);
setInterval(ages, 1000);
addEventListener('resize', () => { if(S.spx){ render(); centre(); } });
document.addEventListener('visibilitychange', () => !document.hidden && tick());

// self-check: console -> tenfoldCheck()
window.tenfoldCheck = () => {
  const r = 7428.78 / 740.86;                             // 10.0272
  console.assert(Math.abs(7485/r - 746.47) < .01, 'equiv');
  console.assert(Math.round(7485/r) === 746, 'listed');
  console.assert(Math.abs(8.20/r - .818) < .001, 'premium');
  const off = s => ((s - Math.floor(s/5)*5)/5 - 0.5) * 22;
  console.assert(Math.abs(off(7430) + 11) < .01, 'line at top of band on a strike');
  console.assert(Math.abs(off(7432.5)) < .01, 'line centred mid-gap');
  console.assert(Math.abs(off(7428.78) - 8.2) < .1, 'line low in band when spot is high in the gap');
  console.assert(Math.abs(off(7431)) <= 11, 'line always stays inside the band');
  // 7425 -> 740.48 and 7430 -> 740.98 both round to SPY 741; 7430 is the closer pair
  const eq = k => k / (7428.78/740.86);
  console.assert(Math.abs(eq(7430)-741) < Math.abs(eq(7425)-741), 'best pair picks the nearer strike');
  console.assert(new Date('2026-07-29T14:06:00Z').toLocaleTimeString('en-US',ET) === '10:06:00', 'NYC clock');
  console.assert(document.querySelectorAll('.row').length === fitN()*2 + 1, 'ladder honours the picker');
  // listed strike above the exact equiv: a call gets cheaper, a put dearer, by at most the gap
  const near = (b, lo, hi) => Math.abs(b[0]-lo) < 1e-9 && Math.abs(b[1]-hi) < 1e-9;
  console.assert(near(bounds(0.818,  0.25, true ), 0.568, 0.818), 'call bound down');
  console.assert(near(bounds(0.818,  0.25, false), 0.818, 1.068), 'put bound up');
  console.assert(near(bounds(0.818, -0.25, true ), 0.818, 1.068), 'call bound up');
  console.assert(bounds(0.818, 0, true)[0] === bounds(0.818, 0, true)[1], 'no gap, no band');
  // normal CDF
  console.assert(Math.abs(ncdf(0) - .5) < 1e-9 && Math.abs(ncdf(1.96) - .975) < 1e-4, 'ncdf');
  console.assert(Math.abs(ncdf(-1.4) - (1 - ncdf(1.4))) < 1e-9, 'ncdf symmetric');
  // round trip: price at a known vol, solve it back
  const T = 3*3600/(365*24*3600), c = bs(7428.78, 7405, T, .12, true);
  const sl = slope(7428.78, 7405, c, true, 3*3600);
  console.assert(Math.abs(sl.iv - .12) < 1e-4, 'iv round trip');
  // an ATM-ish 0DTE call slope sits near -0.5, never outside [-1,0]
  console.assert(sl.d < 0 && sl.d > -1 && Math.abs(sl.d) > .5, 'call slope sign and range');
  const sp = slope(7428.78, 7455, bs(7428.78, 7455, T, .12, false), false, 3*3600);
  console.assert(sp.d > 0 && sp.d < 1, 'put slope sign and range');
  // the tightened estimate must never escape the model-free band
  console.assert(slope(7428.78, 7405, 0.01, true, 3*3600) === null, 'unsolvable premium falls back');
  console.assert(slope(7428.78, 7405, 20, true, null) === null, 'after the close, bound only');
  console.assert(document.querySelectorAll('.row').length % 2 === 1, 'symmetric ladder: 2N+1 strikes');
  return 'ok';
};
</script>
